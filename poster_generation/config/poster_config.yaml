# poster layout configuration

layout:
  # dimensions (inches)
  poster_margin: 1.0
  column_spacing: 1.0
  title_height_fraction: 0.18     # fraction of ( title height / effective height)
  
  # spacing
  section_spacing: 1.0
  element_spacing: 0.2
  title_to_content_spacing: 0.4
  
  # padding
  text_padding:
    left_right: 0.3
    top_bottom: 0.3
  
  # visual elements
  visual_spacing:
    below_visual: 0.3
    side_padding: 0.3

typography:
  fonts:
    title: "Helvetica Neue"
    authors: "Arial"
    section_title: "Helvetica Neue"
    body_text: "Arial"
  
  sizes:  # points
    title: 100
    authors: 72
    section_title: 64
    body_text: 44
    min_font_size: 36
  
  line_spacing: 1.0
  paragraph_spacing: 0.0
  title_author_gap_points: 16

header_planner:
  enabled: true
  default_route: "auto"
  allowed_routes: ["classic_left", "centered", "right_title", "split_logos"]
  subtitle_policy: "auto"
  subtitle_probability: 0.5
  auto_subtitle_max_chars: 52
  auto_subtitle_max_words: 7
  short_title_max_chars: 82
  short_title_max_words: 11
  subtitle_max_chars: 86
  portrait_subtitle_max_chars: 62
  title_logo_gap_inches: 0.28  # compact visual gap; the planner expands the title box to the
                               # actual logo bounds instead of keeping an oversized reserved zone
  min_title_logo_gap_inches: 0.20
  min_title_width_fraction: 0.56
  max_logo_header_fraction: 0.78
  hard_max_logo_header_fraction: 0.88
  max_logo_zone_width_fraction: 0.38
  landscape_combined_logo_zone_fraction: 0.27
  landscape_multi_affiliation_logo_zone_fraction: 0.30
  landscape_single_logo_zone_fraction: 0.24
  logo_resize_check_enabled: true
  preferred_affiliation_logo_scale: 1.50
  preferred_conference_logo_scale: 1.0
  min_effective_logo_area_ratio: 1.08
  conservative_logo_scale: 0.82
  subtitle_title_scale: 0.94
  subtitle_font_scale: 0.58
  portrait_subtitle_font_scale: 0.78
  subtitle_fit_avg_char_width_em: 0.50
  portrait_subtitle_fit_avg_char_width_em: 0.52
  title_subtitle_gap_inches: 0.10
  title_wrap_policy: "auto"
  force_single_line_title: true
  title_fit_avg_char_width_em: 0.52
  portrait_title_fit_avg_char_width_em: 0.56
  wrapped_title_fit_avg_char_width_em: 0.48
  portrait_wrapped_title_fit_avg_char_width_em: 0.40
  title_fit_width_safety: 0.98
  portrait_title_fit_width_safety: 0.94
  title_single_line_min_font_size: 34
  portrait_title_single_line_min_font_size: 32
  portrait_wrapped_title_min_font_size: 44
  subtitle_single_line_min_font_size: 24
  single_line_title_gate_min_font_size: 42
  portrait_single_line_title_gate_min_font_size: 40
  landscape_title_font_size: 100
  landscape_author_font_size: 58
  large_landscape_title_font_size: 108
  large_landscape_author_font_size: 50
  portrait_title_font_size: 72
  portrait_author_font_size: 56
  portrait_title_author_gap_inches: 0.42
  portrait_title_line_height_em: 1.00
  portrait_author_line_height_em: 1.04
  portrait_author_max_lines: 2
  portrait_author_min_font_size: 46
  portrait_max_affiliation_logos: 2
  portrait_logo_strip_height_fraction: 0.30
  portrait_logo_strip_max_height_fraction: 0.40
  portrait_logo_strip_min_height_inches: 1.25
  portrait_min_title_height_inches: 3.75
  portrait_logo_title_gap_inches: 0.14
  portrait_conf_zone_fraction: 0.34
  portrait_logo_divider_gap_inches: 0.18
  portrait_max_logo_height: 2.55
  portrait_logo_strip_max_logo_fraction: 0.88
  portrait_allow_split_logos: true
  portrait_split_logo_side_width_fraction: 0.18
  portrait_split_logo_max_side_width_fraction: 0.24
  portrait_split_wide_conference_aspect_threshold: 3.0
  portrait_split_wide_conference_side_width_fraction: 0.22
  portrait_split_logo_min_side_width_inches: 4.0
  portrait_split_title_logo_gap_inches: 0.34
  portrait_split_title_vertical_offset_inches: 0.55
  manual_affiliation_logo_overrides_auto: true
  stable_random_by_default: false

header_block_review:
  enabled: true
  crop_margin_inches: 0.18
  target_subtitle_title_ratio: 0.64
  min_subtitle_title_ratio: 0.54
  max_subtitle_title_ratio: 0.74
  subtitle_box_line_height: 1.12
  title_subtitle_gap_inches: 0.10
  use_header_author_gap: true
  vlm_enabled: true
  vlm_author_gap_increment_inches: 0.10
  max_author_gap_inches: 0.50

