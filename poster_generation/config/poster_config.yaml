default_visual_density: "balanced"
section_title_numbering: "off"
visual_density_presets:
  lean:
    label: "Lean"
    figure_count: 1
    table_count: 1
    max_visuals_total: 2
    portrait_figure_count: 1
    portrait_table_count: 0
    portrait_max_visuals_total: 1
  balanced:
    label: "Balanced"
    figure_count: 2
    table_count: 2
    max_visuals_total: 4
    portrait_figure_count: 1
    portrait_table_count: 1
    portrait_max_visuals_total: 2
  rich:
    label: "Rich"
    figure_count: 3
    table_count: 2
    max_visuals_total: 5
    portrait_figure_count: 2
    portrait_table_count: 1
    portrait_max_visuals_total: 3

colors:
  # defaults
  fallback_theme: "#1E3A8A"
  fallback_text: "#000000"
  fallback_background: "#FFFFFF"
  
  # color variants
  mono_light:
    saturation: 0.04              # 4%
    brightness: 0.94              # 94%
  
  mono_dark:
    saturation_range: [0.5, 0.6]
    saturation_default: 0.6
  
  contrast_color:
    saturation: 0.85
    brightness_start: 0.50
    brightness_step: 0.05
    brightness_max: 0.90
    wcag_contrast_ratio: 4.5      # WCAG AA standard
    
  complementary:
    hue_offset: 0.5               # 180 degrees
    intensity_reduction: 0.7
    
  # adjustments
  saturation_adjustments:
    light_increase: 0.3
    light_brightness: 0.25
    dark_decrease: 0.2
    contrast_saturation: 0.6
    contrast_brightness: 0.75
  
  # hsv bounds
  hsv_bounds:
    saturation_min: 0.2
    saturation_max: 1.0
    brightness_min: 0.2
    brightness_max: 1.0
    
  # srgb gamma
  srgb:
    gamma_threshold: 0.03928
    gamma_divisor: 1.055
    gamma_offset: 0.055
    gamma_exponent: 2.4
    
  # luminance weights (BT.709)
  luminance_weights:
    red: 0.2126
    green: 0.7152
    blue: 0.0722
  
  # color constants
  constants:
    max_rgb: 255
    white_rgb: [255, 255, 255]
    black_text: "#000000"
    white_text: "#FFFFFF"
    brightness_threshold: 128
    gamma_linear_divisor: 12.92
    # perceived brightness weights
    red_weight: 299
    green_weight: 587
    blue_weight: 114
    brightness_divisor: 1000

text_measurement:
  # binary search
  min_height: 0.1                 # inches
  max_height: 20.0                # inches
  precision: 0.001
  
  # margins (must match renderer)
  margins:
    left: 0.3
    right: 0.3
    top: 0.3
    bottom: 0.3
  
  newline_offset_ratio: 1.0       # font_size/72 per newline

pdf_processing:
  backend: "mineru"
  fallback_backend: "marker"
  mineru:
    base_url: "https://mineru.net"
    model_version: "vlm"
    language: "en"
    enable_table: true
    enable_formula: true
    is_ocr: false
    request_timeout_seconds: 60
    poll_interval_seconds: 5
    poll_timeout_seconds: 900

  # for marker PDF converter fallback
  batch_sizes:
    recognition: 4
    layout: 4
    detection: 4
    table_rec: 4
    ocr_error: 4
    equation: 4
  
  max_section_words: 1000

rendering:
  logo_spacing: 0.5               # inches
  logo_margin: 0.2
  debug_borders: False
  slide_layout_index: 6           # blank slide
  default_shape_fill: "#FFFFFF"
  section_title_chars_per_inch_at_48pt: 3.1

poster_visual_style:
  enabled: true
  main_title:
    font_family: "Georgia"
