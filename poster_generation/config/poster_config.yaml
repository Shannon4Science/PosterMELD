    table_max_height_fraction: 0.74
    default_max_height_fraction: 0.42
    figure_slots:
      - "slot_2"
      - "slot_3"
    table_slots:
      - "slot_6"
      - "slot_5"
    table_unreadable_strategy: "summarize_as_text"
  slot_contracts:
    slot_1:
      role: "Motivation"
      content_role: "foundation"
      visual_policy: "text_only"
      min_chars: 450
      target_chars: 500
      max_chars: 550
      target_bullets: 4
      keypoint_ids: [1, 2]
    slot_2:
      role: "Stable estimation figure"
      content_role: "method"
      visual_policy: "figure_caption"
      min_chars: 80
      target_chars: 100
      max_chars: 120
      target_bullets: 1
      keypoint_ids: [3]
    slot_3:
      role: "Method or architecture figure"
      content_role: "method"
      visual_policy: "figure_caption"
      min_chars: 80
      target_chars: 100
      max_chars: 120
      target_bullets: 1
      keypoint_ids: [4]
    slot_4:
      role: "Main results with table"
      content_role: "results"
      visual_policy: "table_with_callouts"
      min_chars: 280
      target_chars: 320
      max_chars: 360
      target_bullets: 3
      keypoint_ids: [9, 10]
    slot_5:
      role: "Robustness and results summary"
      content_role: "results"
      visual_policy: "text_summary"
      min_chars: 520
      target_chars: 590
      max_chars: 650
      target_bullets: 5
      keypoint_ids: [7, 8]
    slot_6:
      role: "Method details"
      content_role: "method"
      visual_policy: "text_only"
      min_chars: 430
      target_chars: 500
      max_chars: 560
      target_bullets: 4
      keypoint_ids: [5, 6]

